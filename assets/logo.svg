<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Universal Systems">
  <defs>
    <linearGradient id="usi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#458C5E"/>
      <stop offset="100%" stop-color="#3B697A"/>
    </linearGradient>
  </defs>
  <!-- Outer disc with brand gradient (Juniper -> Nebula) -->
  <circle cx="60" cy="60" r="56" fill="url(#usi-grad)"/>
  <!-- Yin-yang S cutout: traces the right outer arc, curves in via two half-circles back to top -->
  <path d="M 60 4
           A 56 56 0 0 1 60 116
           A 28 28 0 0 1 60 60
           A 28 28 0 0 0 60 4 Z"
        fill="#FFFFFF"/>
</svg>
